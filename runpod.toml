# runpod.toml
# ─────────────────────────────────────────────────────────────────────────────
# Reference configuration for the Runpod Serverless endpoint.
#
# THIS FILE IS DOCUMENTATION ONLY — Runpod does not read this file directly.
# Use it as a copy-paste reference when configuring the endpoint in:
#   • The Runpod web console  (https://www.runpod.io/console/serverless)
#   • The Runpod API          (https://docs.runpod.io/serverless/references/api-reference)
#   • runpodctl               (see README.md for deploy.sh example)
#
# GPU: NVIDIA L40S (48 GB VRAM)
# Resolution: 450p (768×448) default, up to 1080p (1920×1088)
# Max duration: 10 seconds (241 frames @ 24 fps)
# Field explanations map to the Runpod console field names exactly.
# ─────────────────────────────────────────────────────────────────────────────

[endpoint]
name = "ltx25-video-gen"

# ── Container image ───────────────────────────────────────────────────────────
# Replace <YOUR_GITHUB_ORG> with your GitHub username or org.
# Use the commit-SHA tag in production for immutability:
#   ghcr.io/<YOUR_GITHUB_ORG>/ltx25-runpod-serverless:sha-<7-char-sha>
container_image = "ghcr.io/fx-dove/ltx2.5:latest"

# ── GPU ───────────────────────────────────────────────────────────────────────
# Primary: NVIDIA L40S (48 GB GDDR6, sm_89).
#   The 22B bf16 transformer alone is ~39 GB, which leaves no room for the
#   Gemma-4-12B text encoder and the two VAEs, so the image defaults to
#   LTX_QUANTIZATION=fp8-cast (~19.6 GB for the transformer).  sm_89 supports
#   fp8 but NOT nvfp4 — nvfp4-* needs Blackwell (sm_100+) and is rejected here.
# Fallback: none recommended.  A 24 GB card (RTX 4090/L4) cannot hold the
#   fp8 transformer plus the text encoder and VAEs resident; it would need
#   LTX_OFFLOAD_MODE=cpu and a much larger execution_timeout.
gpu_type_id = "NVIDIA L40S"   # Runpod GPU type string
# NOTE: if workers sit in THROTTLED, the selected datacenter has no L40S
# capacity — widen the GPU pool (ADA_48_PRO) or add more data centers.

# ── Scaling ───────────────────────────────────────────────────────────────────
# min_workers = 0  →  you pay NOTHING while idle.
# Tradeoff: the first request after an idle period pays a cold-start penalty
# (model load into VRAM, ~30–60 s on L40S). Every subsequent request
# on a warm worker is instantaneous from a loading perspective.
# L40S is cheaper ($1.75/hr serverless) → can afford more max_workers.
min_workers = 0
max_workers = 3

# ── Timeouts ─────────────────────────────────────────────────────────────────
# idle_timeout: seconds a warm worker stays alive with no jobs before shutting
# down.  Lower = less idle billing; higher = fewer cold starts for bursty traffic.
idle_timeout = 60          # seconds

# execution_timeout: maximum wall-clock seconds allowed for a single job.
# The distilled checkpoint runs a fixed 8-step stage 1 + 3-step stage 2 schedule
# (num_inference_steps in the request is accepted but ignored).  Budget for the
# chunked VAE decode and the libx264 encode as well, which stream after
# denoising finishes and dominate at higher resolutions.
execution_timeout = 600    # seconds (10 min)

# ── Storage ───────────────────────────────────────────────────────────────────
# container_disk_size: ephemeral disk for the container's OS + pip cache.
# Weights do NOT live here — they live on the network volume.
# 50 GB covers the base image, Python packages, and temporary video files.
container_disk_size = 50   # GB

# Network volume: attach an existing volume ≥ 100 GB.
# The handler mounts it at /runpod-volume (default Runpod mount path).
# Create the volume first at: Runpod Console → Storage → Network Volumes.
[endpoint.network_volume]
volume_id = "YOUR_NETWORK_VOLUME_ID"   # find this in the Runpod console
mount_path = "/runpod-volume"

# ── Environment variables ─────────────────────────────────────────────────────
# Set secrets via Runpod Console → Secrets, then reference them here by name.
# NEVER put real values in this file — it is committed to version control.
[endpoint.env]

# Required: Hugging Face token for downloading the gated LTX-2.5 checkpoints.
# Create a secret named "HF_TOKEN" in the Runpod console and reference it.
# Only needed on the very first cold start — once the six required safetensors
# are on the network volume, the handler never contacts Hugging Face again.
HF_TOKEN = { secret = "HF_TOKEN" }

# Optional: S3-compatible storage for video uploads.
# If neither this nor BUCKET_ENDPOINT_URL is set, the handler inlines the MP4 as
# base64 in the job result — Runpod caps results at 20 MB, so long or
# high-resolution clips will fail without storage configured.
S3_ENDPOINT_URL = "https://YOUR_ACCOUNT.r2.cloudflarestorage.com"
S3_BUCKET       = "your-bucket-name"
S3_REGION       = "auto"
S3_KEY_PREFIX   = "ltx-2.5"
S3_ACCESS_KEY_ID     = { secret = "S3_ACCESS_KEY_ID" }
S3_SECRET_ACCESS_KEY = { secret = "S3_SECRET_ACCESS_KEY" }
PRESIGNED_URL_TTL_SECONDS = "86400"   # 24 hours

# These are already set in the Dockerfile; listed here for documentation.
HF_HUB_ENABLE_HF_TRANSFER = "1"
PYTHONUNBUFFERED = "1"
# Required to keep the fp8 transformer + VAE from fragmenting VRAM on a 48 GB card.
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

# ── LTX-2.5 runtime knobs (Dockerfile defaults shown; override to change) ─────
# LTX_TRANSFORMER: distilled | distilled-nvfp4 (sm_100+ only) | dev
LTX_TRANSFORMER = "distilled"
# LTX_QUANTIZATION: fp8-cast | fp8-scaled-mm | nvfp4-cast | nvfp4-prequant | none
# fp8-cast is required on a 48 GB L40S — bf16 alone is ~39 GB.
LTX_QUANTIZATION = "fp8-cast"
# LTX_OFFLOAD_MODE: none | cpu | disk.  Switch to "cpu" for 1080p.
LTX_OFFLOAD_MODE = "none"
# LTX_VIDEO_VAE: auto | conv | diffusion.  "auto" prefers the conv VAE when it
# is on the volume; the DiffVAE wants `natten`, which cannot be built against
# torch 2.8, so it runs a slower Triton/eager fallback.
LTX_VIDEO_VAE = "auto"
# LTX_DIFFVAE_MODE: chunked_eager | chunked_compile | combined_compile (needs
# natten) | blackwell_dsl (sm_100+).  Only used with the diffusion VAE.
LTX_DIFFVAE_MODE = "chunked_eager"
# Set to "1" to fetch ltx-2.5-video-vae-conv-bf16 on cold start if absent.
# LTX_DOWNLOAD_CONV_VAE = "0"

# ── Alternative upload path: Runpod's own bucket helper ───────────────────────
# Used only when S3_BUCKET is unset.  These exact names are what
# runpod.serverless.utils.rp_upload reads; it returns a 7-day presigned URL.
# BUCKET_ENDPOINT_URL     = "https://YOUR_ACCOUNT.r2.cloudflarestorage.com"
# BUCKET_ACCESS_KEY_ID     = { secret = "S3_ACCESS_KEY_ID" }
# BUCKET_SECRET_ACCESS_KEY = { secret = "S3_SECRET_ACCESS_KEY" }

# ── Model path resolution (optional overrides) ────────────────────────────────
# The handler discovers models via this priority waterfall:
#   1. MODEL_PATH env var        → use this exact directory as the weights dir
#   2. RUNPOD_VOLUME_PATH env var → weights_dir = <value>/models/ltx-2.5
#   3. Auto-detect /runpod-volume/models/ltx-2.5  (RunPod Serverless default)
#   4. Auto-detect /workspace/models/ltx-2.5      (RunPod Pod / Vast.ai)
#
# For this endpoint the network volume (scr3boo7r9) mounts at /runpod-volume
# and models live at /runpod-volume/models/ltx-2.5.  No overrides are needed
# — auto-detection handles it.  Uncomment below ONLY if you change the layout.
#
# RUNPOD_VOLUME_PATH = "/runpod-volume"
# MODEL_PATH = "/runpod-volume/models/ltx-2.5"
